server:
  port: 8091

spring:
  application:
    name: lab1-loan-approval

camunda:
  client:
    mode: self-managed
    # Camunda 8 Run (c8run) defaults. For the Docker Compose distribution use rest-address http://localhost:8088
    rest-address: http://localhost:8080
    grpc-address: http://localhost:26500
    auth:
      # c8run 8.8 does not protect the API by default. If you get HTTP 401, switch to:
      #   method: basic / username: demo / password: demo
      method: none

lab:
  process-id: loan-approval-process
  outcome-variable: finalOutcome
  # Where the REST connector should call the mock services. Leave empty to use the BPMN default
  # (http://localhost:8090). Docker-based Camunda: http://host.docker.internal:8090
  mock-api-base-url:
  report-variables:
    - applicationId
    - validationStatus
    - creditCheckStatus
    - creditScore
    - dtiRatio
    - eligibility
    - reviewDecision
    - decidedBy
    - sanctionedAmount
    - rejectionReasons

logging:
  level:
    edu.srmist.camunda: INFO
